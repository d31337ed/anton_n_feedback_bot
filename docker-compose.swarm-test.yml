services:
  feedback-bot:
    image: feedback-bot-test:local
    env_file:
      - .env.test.swarm
    secrets:
      - source: bot_token_test
        target: bot_token
    environment:
      REDIS_DB: "15"
    volumes:
      - ./logs:/anton_n_feedback_bot/logs
    deploy:
      restart_policy:
        condition: any

secrets:
  bot_token_test:
    external: true
