services:
  feedback-bot:
    image: sjc.vultrcr.com/dockerregistry/anton_n_feedback_bot:${TEST_TAG:-test}
    # Same host network as prod: Redis on 127.0.0.1 and the mini app port reachable by the host nginx.
    networks:
      - hostnet
    env_file:
      - .env.test.swarm
    secrets:
      - source: bot_token_test
        target: bot_token
    environment:
      REDIS_DB: "15"
    volumes:
      - ./logs:/anton_n_feedback_bot/logs
    deploy:
      restart_policy:
        condition: any

networks:
  hostnet:
    external: true
    name: host

secrets:
  bot_token_test:
    external: true
