services:
  feedback-bot:
    image: sjc.vultrcr.com/dockerregistry/anton_n_feedback_bot:latest
    # Swarm's `docker stack deploy` ignores the compose `network_mode: host`
    # shorthand. Attaching to the pre-existing system "host" network instead
    # gets the same effect: REDIS_HOST=127.0.0.1 in .env.prod reaches the
    # host's Redis directly, same as before the Swarm migration.
    networks:
      - hostnet
    env_file:
      - .env.prod
    secrets:
      - source: bot_token_prod
        target: bot_token
    volumes:
      - ./logs:/anton_n_feedback_bot/logs
    deploy:
      restart_policy:
        condition: any

networks:
  hostnet:
    external: true
    name: host

secrets:
  bot_token_prod:
    external: true
