<b>👇Выберите категорию, нажав на кнопку ниже👇</b>
"""
adv = "Какой тип рекламного сотрудничества вы хотите предложить?"
question = """
<b>Есть два формата вопросов в редакцию:</b>

<b>- 🙋Публичный вопрос</b>
Вы можете задать любой вопрос касаемо путешествий, программ лояльности, миль да и вообще всего, что обсуждается в канале. И если вопрос окажется досаточно универсальным, интересным или частозадаваемым — я дам на него ответ в канале. Пожалуйте, убедитесь, что ответ на этот вопрос уже не был дан в канале или не находится на первой странице гугла.
 <b>- 🙈Частная консультация</b>
Вот тут уже можно рассмотреть ваш конкретный случай. Даже если он банальный, рутинный или просто приватный. Например, если надо найти билеты в экзотичесих условиях по редким направлениям. Или вам нужен билет в бизнесе по конкретному направлению, и вы хотите делегировать мильные разбирательства. Вот для таких вопросов — кнопочка «Частная консультация»

<b>👉Выберите тип вопроса кнопкой ниже</b>
