services:
  feedback-bot:
    build: .
    container_name: feedback-bot-test
    env_file:
      - .env.test
    environment:
      # Хардкод "на всякий случай": даже если тестовый Redis когда-нибудь
      # окажется тем же хостом, что и прод, они не пересекутся по базе.
      REDIS_DB: "15"
    volumes:
      - ./logs:/anton_n_feedback_bot/logs
      - ./session_name.session:/anton_n_feedback_bot/session_name.session
